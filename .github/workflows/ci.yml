name: React Native CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # TEST + LINT + TYPESCRIPT
  # ==========================================
  test:
    name: Test, Lint and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck


  # ==========================================
  # ANDROID DEBUG APK
  # ==========================================
  android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # GRADLE PERMISSION
      # ==========================================
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew


      # ==========================================
      # CLEAN
      # ==========================================
      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace


      # ==========================================
      # SHOW ALL APK FILES
      # ==========================================
      - name: Find generated APK
        run: |
          echo "========== APK FILES =========="
          find android -type f -name "*.apk" -print

          echo "========== DEBUG OUTPUT =========="
          ls -lah android/app/build/outputs/apk/debug/ || true


      # ==========================================
      # VERIFY APK
      # ==========================================
      - name: Verify Debug APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "================================="
            echo "✅ APK FOUND"
            echo "================================="
            ls -lh "$APK"
          else
            echo "================================="
            echo "❌ APK NOT FOUND"
            echo "================================="
            echo "Searching for all APK files..."
            find android -type f -name "*.apk" -print
            exit 1
          fi


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QueryDemo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error